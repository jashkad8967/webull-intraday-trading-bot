services:
  - type: worker
    name: webull-intraday-trading-bot
    runtime: docker
    plan: starter
    region: ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: checksPass
    disk:
      name: trading-bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: WEBULL_APP_KEY
        sync: false
      - key: WEBULL_APP_SECRET
        sync: false
      - key: ACCOUNT_ID
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: LIVE_TRADING_ENABLED
        value: "true"
      - key: AGENT_ENABLED
        value: "true"
      - key: LOG_DIRECTORY
        value: /var/data/logs
      - key: WASH_SALE_STATE_FILE
        value: /var/data/conf/wash_sale_blocks.json
      - key: TZ
        value: America/New_York
