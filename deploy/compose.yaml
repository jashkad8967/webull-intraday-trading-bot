services:
  trader:
    image: webull-intraday-trading-bot:${BOT_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: webull-trading-bot
    restart: unless-stopped
    env_file:
      - ${BOT_ENV_FILE:-/opt/webull-bot/shared/.env}
    environment:
      LOG_DIRECTORY: /var/data/logs
      WASH_SALE_STATE_FILE: /var/data/conf/wash_sale_blocks.json
      INVALID_SYMBOL_STATE_FILE: /var/data/conf/invalid_symbols.json
      STATUS_FILE: /var/data/status.json
      COMMAND_FILE: /var/commands/commands.json
      TZ: America/New_York
    volumes:
      - trading-data:/var/data
      - command-data:/var/commands
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  dashboard:
    image: webull-trading-dashboard:${BOT_IMAGE_TAG:-local}
    build:
      context: ../ui
      dockerfile: Dockerfile
    container_name: webull-trading-dashboard
    restart: unless-stopped
    environment:
      STATUS_FILE: /var/data/status.json
      LOG_DIRECTORY: /var/data/logs
      TRADING_TIMEZONE: America/New_York
      COMMAND_FILE: /var/commands/commands.json
      TZ: America/New_York
    volumes:
      - trading-data:/var/data:ro
      - command-data:/var/commands
    ports:
      # Loopback-only by default: view it with
      # `ssh -L 8080:localhost:8080 <user>@<host>` and open localhost:8080.
      # Change to "0.0.0.0:8080:8080" to expose it directly (and open the
      # firewall port) if you want it reachable without an SSH tunnel.
      - "127.0.0.1:8080:8080"
    depends_on:
      - trader
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  trading-data:
    name: webull-trading-data
  command-data:
    name: webull-trading-commands
