services:
  # ONE container. The dashboard used to be a second service with its
  # own base image and its own dependency tree - two of everything on a
  # 2-core/1GB host whose 8.7G root filled to 99% on 2026-09-23 and
  # wedged Docker, leaving the bot DOWN mid-session with four open
  # option positions and no stop, no profit-lock and no EOD close.
  #
  # The two only ever communicated through files (/var/data/status.json,
  # the log directory, /var/commands/commands.json), so merging them
  # changes no protocol: the dashboard now runs as a second process
  # inside this container reading the same paths on the same local
  # filesystem. See deploy/entrypoint.sh for the process layout and why
  # it is a separate process rather than a thread.
  trader:
    # Pulled from GHCR, built by CI - see deploy/gcp/deploy.sh.
    # Building here used to run ON the production host, a 2-core/1GB
    # box that also runs the bot: it pegged load above 12, starved the
    # trading loop for minutes at a time, and timed out two deploys
    # mid-session on 2026-09-22. BOT_IMAGE_REPO lets a local dev build
    # keep using a plain local tag.
    image: ${BOT_IMAGE_REPO:-webull-intraday-trading-bot}:${BOT_IMAGE_TAG:-local}
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: webull-trading-bot
    restart: unless-stopped
    # Bounded so a leak cannot invite the kernel OOM killer to choose
    # between this and the rest of the box. Covers both processes now.
    mem_limit: 700m
    memswap_limit: 700m
    env_file:
      - ${BOT_ENV_FILE:-/opt/webull-bot/shared/.env}
    environment:
      LOG_DIRECTORY: /var/data/logs
      WASH_SALE_STATE_FILE: /var/data/conf/wash_sale_blocks.json
      INVALID_SYMBOL_STATE_FILE: /var/data/conf/invalid_symbols.json
      DAILY_PNL_STATE_FILE: /var/data/conf/daily_pnl.json
      TRADE_HISTORY_STATE_FILE: /var/data/conf/trade_history.json
      OPTION_CONTRACTS_STATE_FILE: /var/data/conf/option_contracts.json
      # Every state file MUST be pointed into /var/data explicitly.
      #
      # The config defaults are RELATIVE ("conf/x.json"), so a key
      # without a line here resolves under the container's workdir
      # /app - which is baked into the image and is NOT a volume, so
      # the file is silently destroyed on every restart and redeploy.
      # Nothing errors; the store just quietly forgets everything.
      #
      # Found live 2026-09-24: position_open_times.json was being
      # written correctly to /app/conf with real entries, while the
      # feature that depends on it (closing positions carried past
      # their own end-of-day close) could never work, because the
      # whole point of that store is surviving a restart. The audit
      # that caught it also found strategy_tuning had been doing the
      # same thing unnoticed for far longer.
      POSITION_OPEN_TIMES_STATE_FILE: /var/data/conf/position_open_times.json
      STRATEGY_TUNING_STATE_FILE: /var/data/conf/strategy_tuning.json
      STATUS_FILE: /var/data/status.json
      COMMAND_FILE: /var/commands/commands.json
      # Read by the dashboard process, which shares this environment
      # now that it runs in the same container.
      TRADING_TIMEZONE: America/Chicago
      GIT_SHA: ${BOT_IMAGE_TAG:-local}
      # Keep this in step with TRADING_TIMEZONE: the option DTE window
      # and contract pruning call date.today(), which reads the
      # container's system zone, not the configured trading zone. The
      # two only disagree across a midnight boundary, but leaving them
      # mismatched means "today" means two different things inside one
      # process. Console log timestamps follow this too.
      TZ: America/Chicago
    volumes:
      - trading-data:/var/data
      - command-data:/var/commands
    ports:
      # Loopback-only by default: view it with
      # `ssh -L 8080:localhost:8080 <user>@<host>` and open localhost:8080.
      # Change to "0.0.0.0:8080:8080" to expose it directly (and open the
      # firewall port) if you want it reachable without an SSH tunnel.
      - "127.0.0.1:8080:8080"
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  trading-data:
    name: webull-trading-data
  command-data:
    name: webull-trading-commands
