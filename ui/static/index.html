<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webull Scalping Bot</title>
<script>
  (function () {
    try {
      const stored = localStorage.getItem("theme");
      if (stored === "dark" || stored === "light") {
        document.documentElement.setAttribute("data-theme", stored);
      }
    } catch (err) { /* localStorage unavailable - fall back to OS preference */ }
  })();
</script>
<style>
  :root {
    color-scheme: dark light;
    --bg: #0b0e14;
    --panel: #131722;
    --border: #232838;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --green: #3ddc97;
    --red: #ff6b6b;
    --amber: #f5b942;
    --accent: #5b8cff;
    --accent-2: #8b6bf0;
    --teal: #2dd4c8;
    --rose: #ef6ba0;
    --gradient: linear-gradient(135deg, var(--accent), var(--accent-2));
    --shadow: 0 1px 2px rgba(0,0,0,0.24), 0 8px 24px -12px rgba(0,0,0,0.55);
    --row-hover: rgba(255,255,255,0.035);
    --row-alt: rgba(255,255,255,0.018);

    --sp-1: 0.18rem;
    --sp-2: 0.35rem;
    --sp-3: 0.5rem;
    --sp-4: 0.65rem;
    --sp-5: 0.9rem;
    --sp-6: 1.3rem;

    --fs-xs: 0.66rem;
    --fs-sm: 0.74rem;
    --fs-base: 0.83rem;
    --fs-lg: 1.05rem;
    --fs-xl: 1.22rem;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6fb;
      --panel: #ffffff;
      --border: #dde2ee;
      --text: #171a22;
      --muted: #5c6478;
      --shadow: 0 1px 2px rgba(30,40,70,0.06), 0 8px 20px -14px rgba(30,40,70,0.18);
      --row-hover: rgba(20,30,60,0.035);
      --row-alt: rgba(20,30,60,0.02);
    }
  }
  :root[data-theme="dark"] {
    --bg: #0b0e14; --panel: #131722; --border: #232838; --text: #e6e9f0; --muted: #8b93a7;
    --green: #3ddc97; --red: #ff6b6b; --amber: #f5b942; --accent: #5b8cff; --accent-2: #8b6bf0;
    --teal: #2dd4c8; --rose: #ef6ba0;
    --gradient: linear-gradient(135deg, var(--accent), var(--accent-2));
    --shadow: 0 1px 2px rgba(0,0,0,0.24), 0 8px 24px -12px rgba(0,0,0,0.55);
    --row-hover: rgba(255,255,255,0.035); --row-alt: rgba(255,255,255,0.018);
  }
  :root[data-theme="light"] {
    --bg: #f4f6fb; --panel: #ffffff; --border: #dde2ee; --text: #171a22; --muted: #5c6478;
    --green: #3ddc97; --red: #ff6b6b; --amber: #f5b942; --accent: #5b8cff; --accent-2: #8b6bf0;
    --gradient: linear-gradient(135deg, var(--accent), var(--accent-2));
    --shadow: 0 1px 2px rgba(30,40,70,0.06), 0 8px 20px -14px rgba(30,40,70,0.18);
    --row-hover: rgba(20,30,60,0.035); --row-alt: rgba(20,30,60,0.02);
  }

  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: var(--fs-base);
    background: var(--bg);
    color: var(--text);
    padding: var(--sp-5);
  }
  .page { max-width: 1240px; margin: 0 auto; }

  .header-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--sp-4);
    margin-bottom: var(--sp-5);
    padding-bottom: var(--sp-4);
    border-bottom: 1px solid var(--border);
  }
  h1 {
    font-size: var(--fs-xl);
    font-weight: 650;
    letter-spacing: -0.01em;
    margin: 0;
    display: flex;
    align-items: center;
    gap: var(--sp-3);
  }
  @keyframes pulse-ring {
    0% { box-shadow: 0 0 0 0 rgba(61,220,151,0.45); }
    70% { box-shadow: 0 0 0 9px rgba(61,220,151,0); }
    100% { box-shadow: 0 0 0 0 rgba(61,220,151,0); }
  }
  .dot { width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: var(--green); animation: pulse-ring 2s ease-out infinite; }
  .dot.paused { background: var(--amber); box-shadow: 0 0 0 4px rgba(245,185,66,0.15); }
  .badge {
    font-size: var(--fs-xs); color: var(--muted); font-weight: 500;
    padding: 0.15rem 0.55rem; border: 1px solid var(--border); border-radius: 999px;
  }
  .header-right { display: flex; align-items: center; gap: var(--sp-3); }

  .theme-toggle {
    font: inherit; font-size: var(--fs-base); line-height: 1;
    width: 2.1rem; height: 2.1rem; display: inline-flex; align-items: center; justify-content: center;
    border-radius: 999px; border: 1px solid var(--border); background: var(--panel); color: var(--text);
    cursor: pointer; transition: border-color 0.15s ease, color 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }
  .theme-toggle:hover { border-color: var(--accent); color: var(--accent); transform: translateY(-1px); box-shadow: 0 4px 14px -6px rgba(91,140,255,0.45); }

  /* — top row: compact stat list + pending orders side by side — */
  .top-row { display: flex; gap: var(--sp-4); align-items: stretch; margin-bottom: var(--sp-4); }
  .stack-col { display: flex; flex-direction: column; gap: var(--sp-4); }
  .balance-panel { display: flex; flex-direction: column; }
  .balance-panel .chart-wrap { flex: 1; }
  .headline-value { font-weight: 700; font-variant-numeric: tabular-nums; margin-top: var(--sp-1); }
  .stat-list {
    flex: 1; min-width: 0;
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--accent);
    box-shadow: var(--shadow);
    border-radius: 16px; display: flex; flex-direction: column;
  }
  .stat-row {
    display: flex; align-items: baseline; justify-content: space-between; gap: var(--sp-3);
    padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--border);
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-row .label { font-size: var(--fs-xs); color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; font-weight: 600; white-space: nowrap; }
  .stat-row .value { font-size: var(--fs-base); font-weight: 650; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .stat-row .value-stack { display: flex; flex-direction: column; align-items: flex-end; gap: 1px; }
  .stat-row .sub { font-size: var(--fs-xs); color: var(--muted); white-space: nowrap; }
  .pnl-pill {
    display: inline-block; padding: 0.1rem 0.55rem; border-radius: 999px; font-weight: 700;
  }
  .pnl-pill.pos { background: rgba(61,220,151,0.14); color: var(--green); }
  .pnl-pill.neg { background: rgba(255,107,107,0.14); color: var(--red); }

  .panels { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); grid-auto-flow: dense; gap: var(--sp-4); }
  .panel {
    background: var(--panel); border: 1px solid var(--border); border-left: 3px solid var(--border);
    box-shadow: var(--shadow);
    border-radius: 16px; padding: var(--sp-4); min-width: 0; overflow-x: auto;
    transition: box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .panel h2 {
    font-size: var(--fs-xs); margin: 0 0 var(--sp-3); color: var(--muted);
    text-transform: uppercase; letter-spacing: 0.06em; font-weight: 650;
  }
  .panel.accent-blue { border-left-color: var(--accent); }
  .panel.accent-blue h2 { color: var(--accent); }
  .panel.accent-teal { border-left-color: var(--teal); }
  .panel.accent-teal h2 { color: var(--teal); }
  .panel.accent-violet { border-left-color: var(--accent-2); }
  .panel.accent-violet h2 { color: var(--accent-2); }
  .panel.accent-amber { border-left-color: var(--amber); }
  .panel.accent-amber h2 { color: var(--amber); }
  .panel.accent-rose { border-left-color: var(--rose); }
  .panel.accent-rose h2 { color: var(--rose); }
  .panel.span2 { grid-column: span 2; }
  .panel.span3 { grid-column: span 3; }

  table { width: 100%; border-collapse: collapse; font-size: var(--fs-sm); white-space: nowrap; }
  th, td { text-align: left; padding: var(--sp-2) var(--sp-3); border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 600; font-size: var(--fs-xs); text-transform: uppercase; letter-spacing: 0.03em; }
  tr:last-child td { border-bottom: none; }
  tbody tr:nth-child(even) { background: var(--row-alt); }
  tbody tr:hover { background: var(--row-hover); }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .empty { color: var(--muted); font-size: var(--fs-sm); padding: var(--sp-5) 0; text-align: center; }
  .pill {
    display: inline-block; padding: 0.05rem 0.5rem; border-radius: 999px; font-size: var(--fs-xs);
    border: 1px solid var(--border); color: var(--muted); font-variant-numeric: normal; font-weight: 500;
  }
  .logs {
    background: #0a0d13; color: #c9d1d9; border-radius: 12px; padding: var(--sp-3);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: var(--fs-xs);
    line-height: 1.4; max-height: 16rem; overflow-y: auto; white-space: pre-wrap; word-break: break-word;
  }
  .panel.shrink { align-self: start; }
  .btn {
    font: inherit; font-size: var(--fs-xs); font-weight: 650; padding: 0.4rem 0.85rem; border-radius: 999px;
    border: 1px solid var(--border); background: transparent; color: var(--text); cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease, background-color 0.15s ease, opacity 0.15s ease, transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); background: rgba(91,140,255,0.08); transform: translateY(-1px); box-shadow: 0 4px 14px -6px rgba(91,140,255,0.4); }
  .btn:active { transform: translateY(0); box-shadow: none; }
  .btn.danger { color: var(--red); border-color: var(--red); }
  .btn.danger:hover { background: rgba(255,107,107,0.1); box-shadow: 0 4px 14px -6px rgba(255,107,107,0.4); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  td .btn { padding: 0.05rem 0.55rem; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: var(--sp-3); gap: var(--sp-3); }
  .action-msg { font-size: var(--fs-xs); color: var(--muted); min-height: 1.1em; }
  .watchlist-add { display: flex; gap: var(--sp-2); margin-bottom: var(--sp-3); }
  .watchlist-add input {
    flex: 1; font: inherit; font-size: var(--fs-sm); padding: 0.4rem var(--sp-3); border-radius: 999px;
    border: 1px solid var(--border); background: transparent; color: var(--text); transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .watchlist-add input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px rgba(91,140,255,0.15); }
  .scroll-tall { max-height: 8.75rem; overflow-y: auto; }
  .scroll-pending { max-height: 5.25rem; overflow-y: auto; }
  .scroll-tall thead th, .scroll-pending thead th { position: sticky; top: 0; background: var(--panel); z-index: 1; }
  .scroll-tall::-webkit-scrollbar, .scroll-pending::-webkit-scrollbar, .logs::-webkit-scrollbar { width: 8px; height: 8px; }
  .scroll-tall::-webkit-scrollbar-track, .scroll-pending::-webkit-scrollbar-track, .logs::-webkit-scrollbar-track { background: transparent; }
  .scroll-tall::-webkit-scrollbar-thumb, .scroll-pending::-webkit-scrollbar-thumb, .logs::-webkit-scrollbar-thumb {
    background: var(--border); border-radius: 999px;
  }
  .scroll-tall::-webkit-scrollbar-thumb:hover, .scroll-pending::-webkit-scrollbar-thumb:hover, .logs::-webkit-scrollbar-thumb:hover {
    background: var(--muted);
  }
  .chart-wrap { height: 18rem; display: flex; flex-direction: column; }
  .chart-row { flex: 1; min-height: 0; display: flex; gap: var(--sp-2); }
  #balance-chart { flex: 1; min-width: 0; height: 100%; display: block; overflow: visible; }
  .chart-line { fill: none; stroke-width: 0.5; vector-effect: non-scaling-stroke; }
  .chart-line.up { stroke: var(--green); }
  .chart-line.down { stroke: var(--red); }
  .chart-area.up { fill: var(--green); opacity: 0.12; }
  .chart-area.down { fill: var(--red); opacity: 0.12; }
  .chart-gridline { stroke: var(--border); stroke-width: 0.3; vector-effect: non-scaling-stroke; opacity: 0.7; }
  .chart-empty-text { font-size: 3px; fill: var(--muted); text-anchor: middle; }
  .chart-yaxis {
    flex: none; width: 3.6rem; display: flex; flex-direction: column; justify-content: space-between;
    padding: 0.1rem 0; font-size: var(--fs-xs); color: var(--muted); text-align: right;
  }
  .chart-xaxis {
    display: flex; justify-content: space-between; margin-top: 0.3rem;
    padding-right: calc(3.6rem + var(--sp-2)); font-size: var(--fs-xs); color: var(--muted);
  }
</style>
</head>
<body>
<div class="page">
  <div class="header-bar">
    <h1><span class="dot" id="live-dot"></span> Webull Scalping Bot <span class="badge" id="mode-badge"></span> <span class="badge" id="build-badge" title="Currently deployed git commit"></span></h1>
    <div class="header-right">
      <button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()" title="Toggle dark/light mode" aria-label="Toggle dark/light mode">◐</button>
    </div>
  </div>

  <div class="top-row">
    <div class="stack-col" style="flex: 1; min-width: 0;">
      <div class="panel accent-blue">
        <h2>P&amp;L Today</h2>
        <div class="headline-value" id="pnl-today" style="font-size: var(--fs-xl);">—</div>
        <div class="sub" id="pnl-breakdown"></div>
      </div>
      <div class="panel accent-amber" style="flex: 1;">
        <h2>Watchlist</h2>
        <div class="watchlist-add">
          <input type="text" id="watchlist-input" placeholder="Add symbol (e.g. AAPL)" onkeydown="if(event.key==='Enter') addToWatchlist()">
          <button class="btn" onclick="addToWatchlist()">Add</button>
        </div>
        <div class="action-msg" id="watchlist-msg"></div>
        <div class="scroll-tall" id="watchlist"></div>
      </div>
    </div>

    <div class="panel accent-blue balance-panel" style="flex: 2.3; min-width: 0;">
      <div class="toolbar" style="margin-bottom: var(--sp-2);">
        <h2 style="margin:0">Account Balance</h2>
        <span class="sub" id="balance-chart-range"></span>
      </div>
      <div class="chart-wrap">
        <div class="chart-row">
          <svg id="balance-chart" viewBox="0 0 100 30" preserveAspectRatio="none"></svg>
          <div class="chart-yaxis" id="balance-chart-yaxis"></div>
        </div>
        <div class="chart-xaxis" id="balance-chart-xaxis"></div>
      </div>
    </div>
  </div>

  <div class="top-row">
    <div class="stat-list">
      <div class="stat-row"><span class="label">Account Value</span><span class="value" id="account-value">—</span></div>
      <div class="stat-row"><span class="label">Buying Power</span><span class="value" id="buying-power">—</span></div>
      <div class="stat-row"><span class="label">Open Positions</span><span class="value" id="position-count">—</span></div>
      <div class="stat-row"><span class="label">Universe</span><span class="value" id="universe">—</span></div>
      <div class="stat-row"><span class="label">Last Update</span><span class="value" id="last-update">—</span></div>
    </div>

    <div class="panel accent-teal" style="flex: 2; min-width: 0;">
      <div class="toolbar">
        <h2 style="margin:0">Open Positions</h2>
        <button class="btn danger" id="close-all-btn" onclick="closeAll()">Close All</button>
      </div>
      <div class="action-msg" id="positions-msg"></div>
      <div class="scroll-tall" id="positions"></div>
    </div>
  </div>

  <div class="panels">
    <div class="panel span2 accent-violet">
      <h2>Recent Trades</h2>
      <div class="scroll-tall" id="trades"></div>
    </div>
    <div class="panel accent-rose">
      <h2>Market Pulse</h2>
      <div id="agent"></div>
    </div>
    <div class="panel accent-rose">
      <h2>Strategy Review</h2>
      <div id="strategy-review"></div>
    </div>
    <div class="panel accent-blue shrink">
      <h2>Pending Orders</h2>
      <div class="action-msg" id="pending-orders-msg"></div>
      <div class="scroll-pending" id="pending-orders"></div>
    </div>
    <div class="panel span2">
      <h2>Live Logs</h2>
      <div class="logs" id="logs"></div>
    </div>
  </div>
</div>

<script>
function fmtMoney(value) {
  if (value == null) return "—";
  const n = Number(value);
  if (Number.isNaN(n)) return value;
  return n.toLocaleString(undefined, { style: "currency", currency: "USD" });
}
// Per-share price formatter, distinct from fmtMoney (dollar totals/P&L,
// always exactly 2 decimals) - by request, show up to 4 decimal places
// where needed. Sub-$1 stocks trade in real $0.0001 increments (see
// WebullAPI.price_tick_size on the backend, which already prices/sizes
// orders at that precision) - a flat 2-decimal currency format was
// silently rounding away that real precision in the UI, e.g. a stock
// actually priced $0.3771 displaying as just $0.38. $1+ still shows the
// normal 2 decimals, matching how those are actually quoted/traded.
function fmtPrice(value) {
  if (value == null) return "—";
  const n = Number(value);
  if (Number.isNaN(n)) return value;
  const digits = Math.abs(n) < 1 ? 4 : 2;
  return n.toLocaleString(undefined, {
    style: "currency",
    currency: "USD",
    minimumFractionDigits: digits,
    maximumFractionDigits: digits,
  });
}
function fmtNum(value) {
  if (value == null) return "—";
  const n = Number(value);
  if (Number.isNaN(n)) return value;
  return n.toLocaleString();
}
function fmtTime(seconds) {
  if (!seconds) return "—";
  return new Date(seconds * 1000).toLocaleTimeString();
}
function fmtAxisTime(seconds) {
  if (!seconds) return "—";
  return new Date(seconds * 1000).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
}
function fmtAxisMoney(value) {
  const n = Number(value);
  if (Number.isNaN(n)) return "—";
  const sign = n < 0 ? "-" : "";
  return sign + "$" + Math.abs(n).toLocaleString(undefined, { maximumFractionDigits: 0 });
}
function pnlClass(value) {
  if (value == null) return "";
  const n = Number(value);
  return n > 0 ? "pos" : n < 0 ? "neg" : "";
}
function orderSide(action) {
  // SHORT opens a position by selling first; PROFIT/STOP/MANUAL_SELL close
  // one by selling (the common long case) - everything else here is an
  // order that buys.
  const sells = ["SHORT", "PROFIT", "STOP", "MANUAL_SELL"];
  return sells.includes(action) ? "SELL" : "BUY";
}

function table(headers, rows, colWidths) {
  if (!rows || rows.length === 0) return '<div class="empty">None right now</div>';
  const colgroup = colWidths
    ? '<colgroup>' + colWidths.map(w => `<col style="width:${w}%">`).join("") + '</colgroup>'
    : "";
  const head = headers.map(h => `<th class="${h.num ? 'num' : ''}">${h.label}</th>`).join("");
  const body = rows.map(row => {
    const cells = headers.map(h => {
      let content;
      try { content = h.render(row); } catch (err) { content = "—"; }
      let cls = "";
      try { cls = h.cls ? h.cls(row) : ""; } catch (err) { cls = ""; }
      if (h.num) cls = (cls + " num").trim();
      return `<td class="${cls}">${content}</td>`;
    }).join("");
    return `<tr>${cells}</tr>`;
  }).join("");
  return `<table>${colgroup}<thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

async function refresh() {
  const dot = document.getElementById("live-dot");
  try {
    const res = await fetch("/api/status", { cache: "no-store" });
    const data = await res.json();
    document.getElementById("build-badge").textContent = data.git_sha ? `build ${data.git_sha}` : "";

    if (!data.updated_at) {
      dot.className = "dot";
      document.getElementById("last-update").textContent = data.message || "Waiting…";
      return;
    }
    dot.className = "dot " + (data.paused ? "paused" : "live");
    document.getElementById("mode-badge").textContent = data.mode ? `mode=${data.mode}` + (data.paused ? " · PAUSED" : "") : "";
    document.getElementById("buying-power").textContent = fmtMoney(data.buying_power);
    document.getElementById("account-value").textContent = fmtMoney(data.account_value);
    const pnl = data.pnl_today || {};
    const pnlEl = document.getElementById("pnl-today");
    pnlEl.textContent = fmtMoney(pnl.total ?? 0);
    pnlEl.className = "headline-value pnl-pill " + pnlClass(pnl.total ?? 0);
    document.getElementById("pnl-breakdown").textContent =
      `realized ${fmtMoney(pnl.realized ?? 0)} · open ${fmtMoney(pnl.open ?? 0)}`;
    document.getElementById("position-count").textContent = (data.positions || []).length;
    const universe = data.universe || {};
    document.getElementById("universe").textContent = `${universe.stocks ?? 0} stocks / ${universe.options ?? 0} options`;
    document.getElementById("last-update").textContent = fmtTime(data.updated_at);

    document.getElementById("positions").innerHTML = table([
      { label: "Symbol", render: r => r.symbol ?? "—" },
      { label: "Type", render: r => r.instrument_type ?? "—" },
      { label: "Qty", render: r => fmtNum(r.quantity), num: true },
      { label: "Cost", render: r => fmtPrice(r.cost_price), num: true },
      { label: "Last", render: r => fmtPrice(r.last_price), num: true },
      { label: "P&L", render: r => fmtMoney(r.unrealized_pnl), cls: r => pnlClass(r.unrealized_pnl), num: true },
      { label: "Bucket", render: r => r.bucket ? `<span class="pill">${r.bucket}</span>` : "—" },
      { label: "", render: r => `<button class="btn danger" onclick="sellPosition('${r.symbol}','${r.instrument_type}')">Sell</button>` },
    ], data.positions);

    document.getElementById("pending-orders").innerHTML = table([
      { label: "Time", render: r => r.age_seconds != null ? fmtTime(Date.now() / 1000 - r.age_seconds) : "—" },
      { label: "Stock", render: r => r.symbol ?? "—" },
      { label: "Buy/Sell", render: r => orderSide(r.action) },
      { label: "Qty", render: r => r.quantity != null ? fmtNum(r.quantity) : "—", num: true },
      { label: "Price", render: r => r.limit_price != null ? fmtPrice(r.limit_price) : "market", num: true },
      {
        label: "",
        render: r => r.cancel_requested
          ? '<span class="pill">cancelling…</span>'
          : `<button class="btn danger" onclick="cancelOrder('${r.order_id}','${r.symbol}')">Cancel</button>`,
      },
    ], data.pending_orders, [24, 22, 18, 16, 20]);

    document.getElementById("trades").innerHTML = table([
      { label: "Time", render: r => fmtTime(r.time) },
      { label: "Type", render: r => r.instrument_type ?? "—" },
      { label: "Action", render: r => r.action ?? "—" },
      { label: "Symbol", render: r => r.symbol ?? "—" },
      { label: "Qty", render: r => r.quantity != null ? fmtNum(r.quantity) : "—", num: true },
      { label: "Entry", render: r => r.entry_price != null ? fmtPrice(r.entry_price) : "—", num: true },
      { label: "Exit", render: r => r.limit_price != null ? fmtPrice(r.limit_price) : "—", num: true },
      { label: "P&L", render: r => r.pnl != null ? fmtMoney(r.pnl) : "—", cls: r => pnlClass(r.pnl), num: true },
    ], data.recent_trades);

    document.getElementById("watchlist").innerHTML = table([
      { label: "Symbol", render: r => r.symbol ?? "—" },
      { label: "Price", render: r => fmtPrice(r.price), num: true },
      { label: "Bucket", render: r => r.bucket ? `<span class="pill">${r.bucket}</span>` : "—" },
      { label: "Vol", render: r => r.volume != null ? r.volume.toLocaleString() : "—", num: true },
      { label: "Spread%", render: r => r.spread_percent != null ? r.spread_percent : "—", num: true },
      {
        label: "",
        render: r => r.has_position
          ? '<span class="pill">Held</span>'
          : `<button class="btn" onclick="buyPosition('${r.symbol}')">Buy</button>`,
      },
    ], data.watchlist);

    const agent = data.agent;
    if (!agent) {
      document.getElementById("agent").innerHTML = '<div class="empty">Agent disabled</div>';
    } else {
      const pulse = agent.market_pulse || {};
      const pulseList = list => (list || []).map(e => `${e.symbol} (${e.chg > 0 ? "+" : ""}${e.chg}%)`).join(", ") || "none yet";
      const popular = (agent.popular_symbols || []).join(", ") || "none yet";
      document.getElementById("agent").innerHTML =
        `<div><strong>Gainers:</strong> ${pulseList(pulse.gainers)}</div>` +
        `<div style="margin-top:0.4rem"><strong>Losers:</strong> ${pulseList(pulse.losers)}</div>` +
        `<div style="margin-top:0.4rem"><strong>Most active:</strong> ${pulseList(pulse.most_active)}</div>` +
        `<div style="margin-top:0.4rem"><strong>Boosted priority:</strong> ${popular}</div>`;
    }

    const review = agent && agent.strategy_review;
    const reviewEl = document.getElementById("strategy-review");
    if (!review) {
      reviewEl.innerHTML = '<div class="empty">No suggestion yet</div>';
    } else {
      const severityClass = { minor: "", moderate: "neg", severe: "neg" }[review.severity] || "";
      const changes = (review.suggested_changes || []).map(c =>
        `<div style="margin-top:0.3rem"><strong>${c.lever}</strong> (${c.direction}) - ${c.reasoning}</div>`
      ).join("") || "";
      reviewEl.innerHTML =
        `<div class="${severityClass}"><strong>${(review.severity || "none").toUpperCase()}</strong> · confidence ${fmtNum(review.confidence)}</div>` +
        `<div style="margin-top:0.4rem">${review.assessment || "—"}</div>` +
        changes;
    }

    renderBalanceChart(data.balance_history || []);
  } catch (err) {
    dot.className = "dot";
  }
}

function renderBalanceChart(history) {
  const svg = document.getElementById("balance-chart");
  const rangeEl = document.getElementById("balance-chart-range");
  const yAxisEl = document.getElementById("balance-chart-yaxis");
  const xAxisEl = document.getElementById("balance-chart-xaxis");
  if (!history || history.length < 2) {
    svg.innerHTML = '<text x="50" y="16" class="chart-empty-text">Waiting for balance history…</text>';
    rangeEl.textContent = "";
    yAxisEl.innerHTML = "";
    xAxisEl.innerHTML = "";
    return;
  }
  const values = history.map(p => Number(p.balance));
  const first = values[0];
  const last = values[values.length - 1];
  const min = Math.min(...values);
  const max = Math.max(...values);
  const pad = (max - min) * 0.12 || Math.abs(first) * 0.01 || 1;
  const yMin = min - pad;
  const yMax = max + pad;
  const W = 100, H = 30;
  const points = values.map((v, i) => {
    const x = (i / (values.length - 1)) * W;
    const y = H - ((v - yMin) / (yMax - yMin)) * H;
    return `${x.toFixed(2)},${y.toFixed(2)}`;
  });
  const up = last >= first;
  const cls = up ? "up" : "down";
  const linePoints = points.join(" ");
  const areaPoints = `0,${H} ${linePoints} ${W},${H}`;

  const Y_TICKS = 4;
  let gridlines = "";
  const yLabels = [];
  for (let i = 0; i < Y_TICKS; i++) {
    const frac = i / (Y_TICKS - 1);
    const value = yMax - (yMax - yMin) * frac;
    const y = H * frac;
    gridlines += `<line class="chart-gridline" x1="0" y1="${y.toFixed(2)}" x2="${W}" y2="${y.toFixed(2)}"></line>`;
    yLabels.push(`<span>${fmtAxisMoney(value)}</span>`);
  }
  yAxisEl.innerHTML = yLabels.join("");

  svg.innerHTML =
    gridlines +
    `<polygon class="chart-area ${cls}" points="${areaPoints}"></polygon>` +
    `<polyline class="chart-line ${cls}" points="${linePoints}"></polyline>`;

  const X_TICKS = 3;
  const xLabels = [];
  for (let i = 0; i < X_TICKS; i++) {
    const idx = Math.round((i / (X_TICKS - 1)) * (history.length - 1));
    xLabels.push(`<span>${fmtAxisTime(history[idx].time)}</span>`);
  }
  xAxisEl.innerHTML = xLabels.join("");

  const change = last - first;
  const changePct = first !== 0 ? (change / Math.abs(first)) * 100 : 0;
  const sign = change >= 0 ? "+" : "";
  const spanSeconds = history[history.length - 1].time - history[0].time;
  const spanLabel = spanSeconds >= 3600
    ? `${(spanSeconds / 3600).toFixed(1)}h`
    : `${Math.round(spanSeconds / 60)}m`;
  rangeEl.textContent =
    `${fmtMoney(first)} → ${fmtMoney(last)} (${sign}${fmtMoney(change)} / ${sign}${changePct.toFixed(2)}%) · last ${spanLabel}`;
}

async function postAction(url, body, msgEl, busyLabel, doneLabel) {
  const el = document.getElementById(msgEl);
  el.textContent = busyLabel;
  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    const data = await res.json();
    if (res.ok && data.queued) {
      el.textContent = doneLabel;
    } else {
      el.textContent = data.error || "Request failed.";
    }
  } catch (err) {
    el.textContent = "Request failed - is the bot running?";
  }
  setTimeout(() => { el.textContent = ""; }, 5000);
  refresh();
}

function closeAll() {
  if (!confirm("Close ALL open positions (stocks and options) right now?")) return;
  postAction("/api/close-all", {}, "positions-msg", "Closing all positions…", "Close-all requested - the bot will act on its next cycle.");
}

function sellPosition(symbol, instrumentType) {
  if (!confirm(`Sell your entire ${symbol} position now?`)) return;
  postAction(
    "/api/sell",
    { symbol, instrument_type: instrumentType },
    "positions-msg",
    `Selling ${symbol}…`,
    `Sell requested for ${symbol} - the bot will act on its next cycle.`,
  );
}

function buyPosition(symbol) {
  if (!confirm(`Buy ${symbol} now?`)) return;
  postAction(
    "/api/buy",
    { symbol },
    "watchlist-msg",
    `Buying ${symbol}…`,
    `Buy requested for ${symbol} - the bot will act on its next cycle.`,
  );
}

function cancelOrder(orderId, symbol) {
  if (!confirm(`Cancel the pending order for ${symbol}?`)) return;
  postAction(
    "/api/cancel-order",
    { order_id: orderId },
    "pending-orders-msg",
    `Cancelling ${symbol}…`,
    `Cancel requested for ${symbol} - the bot will act on its next cycle.`,
  );
}

function addToWatchlist() {
  const input = document.getElementById("watchlist-input");
  const symbol = (input.value || "").trim().toUpperCase();
  if (!symbol) return;
  postAction(
    "/api/watchlist",
    { symbol },
    "watchlist-msg",
    `Adding ${symbol}…`,
    `${symbol} queued to join the watchlist on the bot's next cycle.`,
  );
  input.value = "";
}

function toggleTheme() {
  const current = document.documentElement.getAttribute("data-theme");
  const osIsLight = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches;
  const effective = current || (osIsLight ? "light" : "dark");
  const next = effective === "dark" ? "light" : "dark";
  document.documentElement.setAttribute("data-theme", next);
  try { localStorage.setItem("theme", next); } catch (err) { /* ignore */ }
}

async function refreshLogs() {
  const box = document.getElementById("logs");
  const stickToBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
  try {
    const res = await fetch("/api/logs?lines=300", { cache: "no-store" });
    const data = await res.json();
    const lines = data.lines || [];
    box.textContent = lines.length ? lines.join("\n") : "Waiting for log output…";
    if (stickToBottom) box.scrollTop = box.scrollHeight;
  } catch (err) {
    // leave whatever was last shown
  }
}

refresh();
refreshLogs();
setInterval(refresh, 150);
setInterval(refreshLogs, 250);
</script>
