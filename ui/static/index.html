<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Webull Scalping Bot</title>
<style>
  :root {
    color-scheme: dark light;
    --bg: #0b0e14;
    --panel: #131722;
    --border: #232838;
    --text: #e6e9f0;
    --muted: #8b93a7;
    --green: #3ddc97;
    --red: #ff6b6b;
    --amber: #f5b942;
    --accent: #5b8cff;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f4f6fb;
      --panel: #ffffff;
      --border: #dde2ee;
      --text: #171a22;
      --muted: #5c6478;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 1.25rem;
  }
  h1 { font-size: 1.15rem; margin: 0 0 0.9rem; display: flex; align-items: center; gap: 0.6rem; }
  .dot { width: 0.55rem; height: 0.55rem; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--green); box-shadow: 0 0 0 4px rgba(61,220,151,0.15); }
  .dot.paused { background: var(--amber); }
  .badge { font-size: 0.7rem; color: var(--muted); font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 0.75rem; margin-bottom: 1rem; }
  .stat { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 0.85rem 1rem; }
  .stat .label { font-size: 0.72rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .stat .value { font-size: 1.35rem; font-weight: 600; margin-top: 0.15rem; }
  .panels { display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 1rem; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 0.9rem 1rem; overflow-x: auto; }
  .panel h2 { font-size: 0.85rem; margin: 0 0 0.6rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.04em; }
  table { width: 100%; border-collapse: collapse; font-size: 0.82rem; white-space: nowrap; }
  th, td { text-align: left; padding: 0.35rem 0.5rem; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  tr:last-child td { border-bottom: none; }
  .pos { color: var(--green); }
  .neg { color: var(--red); }
  .empty { color: var(--muted); font-size: 0.82rem; padding: 0.5rem 0; }
  .pill { display: inline-block; padding: 0.05rem 0.45rem; border-radius: 999px; font-size: 0.68rem; border: 1px solid var(--border); color: var(--muted); }
  .logs {
    background: #0a0d13;
    color: #c9d1d9;
    border-radius: 8px;
    padding: 0.6rem 0.75rem;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    font-size: 0.72rem;
    line-height: 1.45;
    max-height: 22rem;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .panel.wide { grid-column: 1 / -1; }
  .btn {
    font: inherit;
    font-size: 0.75rem;
    padding: 0.3rem 0.6rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
    cursor: pointer;
  }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.danger { color: var(--red); border-color: var(--red); }
  .btn.danger:hover { background: rgba(255,107,107,0.1); }
  .btn:disabled { opacity: 0.5; cursor: default; }
  .toolbar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.6rem; gap: 0.6rem; }
  .action-msg { font-size: 0.75rem; color: var(--muted); }
  .watchlist-add { display: flex; gap: 0.4rem; margin-bottom: 0.6rem; }
  .watchlist-add input {
    flex: 1;
    font: inherit;
    font-size: 0.8rem;
    padding: 0.3rem 0.5rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--text);
  }
  .scroll-tall { max-height: 22rem; overflow-y: auto; }
</style>
</head>
<body>
  <h1><span class="dot" id="live-dot"></span> Webull Scalping Bot <span class="badge" id="mode-badge"></span></h1>

  <div class="grid">
    <div class="stat"><div class="label">Buying Power</div><div class="value" id="buying-power">—</div></div>
    <div class="stat">
      <div class="label">P&L Today</div>
      <div class="value" id="pnl-today">—</div>
      <div class="action-msg" id="pnl-breakdown"></div>
    </div>
    <div class="stat"><div class="label">Open Positions</div><div class="value" id="position-count">—</div></div>
    <div class="stat"><div class="label">Universe</div><div class="value" id="universe">—</div></div>
    <div class="stat"><div class="label">Last Update</div><div class="value" id="last-update">—</div></div>
  </div>

  <div class="panels">
    <div class="panel">
      <div class="toolbar">
        <h2 style="margin:0">Open Positions</h2>
        <button class="btn danger" id="close-all-btn" onclick="closeAll()">Close All</button>
      </div>
      <div class="action-msg" id="positions-msg"></div>
      <div id="positions"></div>
    </div>
    <div class="panel">
      <h2>Pending Orders</h2>
      <div class="action-msg" id="pending-orders-msg"></div>
      <div id="pending-orders"></div>
    </div>
    <div class="panel">
      <h2>Recent Trades (Buy / Sell Price / P&amp;L)</h2>
      <div id="trades"></div>
    </div>
    <div class="panel">
      <h2>Watchlist</h2>
      <div class="watchlist-add">
        <input type="text" id="watchlist-input" placeholder="Add symbol (e.g. AAPL)" onkeydown="if(event.key==='Enter') addToWatchlist()">
        <button class="btn" onclick="addToWatchlist()">Add</button>
      </div>
      <div class="action-msg" id="watchlist-msg"></div>
      <div class="scroll-tall" id="watchlist"></div>
    </div>
    <div class="panel">
      <h2>Research Agent</h2>
      <div id="agent"></div>
    </div>
    <div class="panel wide">
      <h2>Live Logs</h2>
      <div class="logs" id="logs"></div>
    </div>
  </div>

<script>
function fmtMoney(value) {
  const n = Number(value);
  if (Number.isNaN(n)) return value ?? "—";
  return n.toLocaleString(undefined, { style: "currency", currency: "USD" });
}
function fmtTime(seconds) {
  if (!seconds) return "—";
  return new Date(seconds * 1000).toLocaleTimeString();
}
function pnlClass(value) {
  const n = Number(value);
  return n > 0 ? "pos" : n < 0 ? "neg" : "";
}
function table(headers, rows) {
  if (!rows || rows.length === 0) return '<div class="empty">None right now</div>';
  const head = headers.map(h => `<th>${h.label}</th>`).join("");
  const body = rows.map(row => {
    const cells = headers.map(h => `<td class="${h.cls ? h.cls(row) : ''}">${h.render(row)}</td>`).join("");
    return `<tr>${cells}</tr>`;
  }).join("");
  return `<table><thead><tr>${head}</tr></thead><tbody>${body}</tbody></table>`;
}

async function refresh() {
  const dot = document.getElementById("live-dot");
  try {
    const res = await fetch("/api/status", { cache: "no-store" });
    const data = await res.json();

    if (!data.updated_at) {
      dot.className = "dot";
      document.getElementById("last-update").textContent = data.message || "Waiting…";
      return;
    }
    dot.className = "dot " + (data.paused ? "paused" : "live");
    document.getElementById("mode-badge").textContent = data.mode ? `mode=${data.mode}` + (data.paused ? " · PAUSED" : "") : "";
    document.getElementById("buying-power").textContent = fmtMoney(data.buying_power);
    const pnl = data.pnl_today || {};
    const pnlEl = document.getElementById("pnl-today");
    pnlEl.textContent = fmtMoney(pnl.total ?? 0);
    pnlEl.className = "value " + pnlClass(pnl.total ?? 0);
    document.getElementById("pnl-breakdown").textContent =
      `realized ${fmtMoney(pnl.realized ?? 0)} · unrealized ${fmtMoney(pnl.unrealized ?? 0)}`;
    document.getElementById("position-count").textContent = (data.positions || []).length;
    const universe = data.universe || {};
    document.getElementById("universe").textContent = `${universe.stocks ?? 0} stocks / ${universe.options ?? 0} options`;
    document.getElementById("last-update").textContent = fmtTime(data.updated_at);

    document.getElementById("positions").innerHTML = table([
      { label: "Symbol", render: r => r.symbol },
      { label: "Type", render: r => r.instrument_type },
      { label: "Qty", render: r => r.quantity },
      { label: "Cost", render: r => fmtMoney(r.cost_price) },
      { label: "Last", render: r => fmtMoney(r.last_price) },
      { label: "P&L", render: r => fmtMoney(r.unrealized_pnl), cls: r => pnlClass(r.unrealized_pnl) },
      { label: "Bucket", render: r => `<span class="pill">${r.bucket}</span>` },
      { label: "", render: r => `<button class="btn danger" onclick="sellPosition('${r.symbol}','${r.instrument_type}')">Sell</button>` },
    ], data.positions);

    document.getElementById("pending-orders").innerHTML = table([
      { label: "Symbol", render: r => r.symbol },
      { label: "Type", render: r => r.instrument_type },
      { label: "Action", render: r => r.action },
      { label: "Price", render: r => r.limit_price ? fmtMoney(r.limit_price) : "market" },
      { label: "Age", render: r => `${r.age_seconds}s` },
      {
        label: "",
        render: r => r.cancel_requested
          ? '<span class="pill">cancelling…</span>'
          : `<button class="btn danger" onclick="cancelOrder('${r.order_id}','${r.symbol}')">Cancel</button>`,
      },
    ], data.pending_orders);

    document.getElementById("trades").innerHTML = table([
      { label: "Time", render: r => fmtTime(r.time) },
      { label: "Type", render: r => r.instrument_type },
      { label: "Action", render: r => r.action },
      { label: "Symbol", render: r => r.symbol },
      { label: "Price", render: r => r.limit_price ? fmtMoney(r.limit_price) : "—" },
      { label: "P&L", render: r => r.pnl ? fmtMoney(r.pnl) : "—", cls: r => r.pnl ? pnlClass(r.pnl) : "" },
    ], data.recent_trades);

    document.getElementById("watchlist").innerHTML = table([
      { label: "Symbol", render: r => r.symbol },
      { label: "Price", render: r => fmtMoney(r.price) },
      { label: "Bucket", render: r => `<span class="pill">${r.bucket}</span>` },
      { label: "Vol", render: r => (r.volume ?? "—").toLocaleString ? r.volume.toLocaleString() : r.volume },
      { label: "Spread%", render: r => r.spread_percent ?? "—" },
      {
        label: "",
        render: r => r.has_position
          ? '<span class="pill">Held</span>'
          : `<button class="btn" onclick="buyPosition('${r.symbol}')">Buy</button>`,
      },
    ], data.watchlist);

    const agent = data.agent;
    if (!agent) {
      document.getElementById("agent").innerHTML = '<div class="empty">Research agent disabled</div>';
    } else {
      const discoveries = (agent.discoveries || []).map(d => d.symbol).join(", ") || "none yet";
      const popular = (agent.popular_symbols || []).join(", ") || "none yet";
      document.getElementById("agent").innerHTML =
        `<div><strong>Discoveries:</strong> ${discoveries}</div>` +
        `<div style="margin-top:0.4rem"><strong>Boosted priority:</strong> ${popular}</div>`;
    }
  } catch (err) {
    dot.className = "dot";
  }
}

async function postAction(url, body, msgEl, busyLabel, doneLabel) {
  const el = document.getElementById(msgEl);
  el.textContent = busyLabel;
  try {
    const res = await fetch(url, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(body || {}),
    });
    const data = await res.json();
    if (res.ok && data.queued) {
      el.textContent = doneLabel;
    } else {
      el.textContent = data.error || "Request failed.";
    }
  } catch (err) {
    el.textContent = "Request failed - is the bot running?";
  }
  setTimeout(() => { el.textContent = ""; }, 5000);
  refresh();
}

function closeAll() {
  if (!confirm("Close ALL open positions (stocks and options) right now?")) return;
  postAction("/api/close-all", {}, "positions-msg", "Closing all positions…", "Close-all requested - the bot will act on its next cycle.");
}

function sellPosition(symbol, instrumentType) {
  if (!confirm(`Sell your entire ${symbol} position now?`)) return;
  postAction(
    "/api/sell",
    { symbol, instrument_type: instrumentType },
    "positions-msg",
    `Selling ${symbol}…`,
    `Sell requested for ${symbol} - the bot will act on its next cycle.`,
  );
}

function buyPosition(symbol) {
  if (!confirm(`Buy ${symbol} now?`)) return;
  postAction(
    "/api/buy",
    { symbol },
    "watchlist-msg",
    `Buying ${symbol}…`,
    `Buy requested for ${symbol} - the bot will act on its next cycle.`,
  );
}

function cancelOrder(orderId, symbol) {
  if (!confirm(`Cancel the pending order for ${symbol}?`)) return;
  postAction(
    "/api/cancel-order",
    { order_id: orderId },
    "pending-orders-msg",
    `Cancelling ${symbol}…`,
    `Cancel requested for ${symbol} - the bot will act on its next cycle.`,
  );
}

function addToWatchlist() {
  const input = document.getElementById("watchlist-input");
  const symbol = (input.value || "").trim().toUpperCase();
  if (!symbol) return;
  postAction(
    "/api/watchlist",
    { symbol },
    "watchlist-msg",
    `Adding ${symbol}…`,
    `${symbol} queued to join the watchlist on the bot's next cycle.`,
  );
  input.value = "";
}

async function refreshLogs() {
  const box = document.getElementById("logs");
  const stickToBottom = box.scrollTop + box.clientHeight >= box.scrollHeight - 20;
  try {
    const res = await fetch("/api/logs?lines=300", { cache: "no-store" });
    const data = await res.json();
    const lines = data.lines || [];
    box.textContent = lines.length ? lines.join("\n") : "Waiting for log output…";
    if (stickToBottom) box.scrollTop = box.scrollHeight;
  } catch (err) {
    // leave whatever was last shown
  }
}

refresh();
refreshLogs();
setInterval(refresh, 250);
setInterval(refreshLogs, 250);
</script>
</body>
</html>
