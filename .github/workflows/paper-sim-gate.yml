name: Paper-sim gate (auto-merge + deploy)

# One self-contained pipeline for the paper-trading-lane branch - every
# stage below is a job in THIS SAME workflow run, chained with `needs:`,
# specifically so the live deploy never depends on a second, separately
# triggered workflow run. (An earlier version split the merge-to-main step
# into this workflow and left the deploy to ci.yml's own push-triggered
# job - but a push made from inside a workflow using the default
# GITHUB_TOKEN does not trigger other workflow runs, by GitHub's own
# anti-recursion design, so that deploy never fired. Doing the deploy as
# a job here instead sidesteps that entirely.)
#
#   validate -> paper-sim-gate -> merge-to-main -> deploy-live
#
# validate: compileall, the full test suite, deploy-script syntax, compose
#   config checks, both Docker images building - no network calls.
# paper-sim-gate: scripts/evaluate_paper_sim.py - the fully synthetic
#   scenario suite (see tests/paper_sim/scenarios.py). This is the whole
#   safety margin before a change reaches real money, on top of main's own
#   always-on live guardrails (stop-loss guard, circuit breakers, wash-sale
#   blocking), which stay in effect regardless of what merges in. Any
#   failure here stops the chain - no merge, no deploy, main untouched.
# merge-to-main: on a clean pass, merges this exact commit into main and
#   pushes - no PR, no human approval step. This is a deliberate, explicitly
#   confirmed choice.
# deploy-live: deploys that same validated commit to the live host, gated
#   on GCP_DEPLOY_ENABLED (the same flag ci.yml's own deploy-gcp job uses
#   for direct pushes to main).

on:
  push:
    branches: [paper-trading-lane]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src tests ui scripts
      - run: PYTHONPATH=src python -m unittest discover -v -s tests
      - run: bash -n deploy/gcp/bootstrap.sh deploy/gcp/deploy.sh
      - run: BOT_ENV_FILE="$GITHUB_WORKSPACE/.env.example" BOT_IMAGE_TAG=ci docker compose -f deploy/compose.yaml config
      - run: docker build --tag webull-intraday-trading-bot:ci .
      - run: docker build --tag webull-trading-dashboard:ci ui

  paper-sim-gate:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Run the synthetic edge-case gate
        run: python scripts/evaluate_paper_sim.py | tee "$RUNNER_TEMP/gate-output.txt"

      - name: Publish job summary on failure
        if: failure()
        run: |
          {
            echo "## Paper-sim gate FAILED"
            echo
            echo '```'
            tail -n 60 "$RUNNER_TEMP/gate-output.txt"
            echo '```'
            echo
            echo "main was NOT updated."
          } >> "$GITHUB_STEP_SUMMARY"

  merge-to-main:
    needs: paper-sim-gate
    runs-on: ubuntu-latest
    concurrency:
      group: paper-sim-gate-merge
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: paper-trading-lane
          fetch-depth: 0

      - name: Merge into main and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B main origin/main
          git merge --no-ff "${GITHUB_SHA}" \
            -m "Auto-merge paper-trading-lane: paper-sim gate passed (${GITHUB_SHA})"
          git push origin main

      - name: Publish job summary
        run: |
          {
            echo "## Paper-sim gate PASSED"
            echo
            echo "Merged paper-trading-lane (\`${GITHUB_SHA}\`) into main."
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-live:
    needs: merge-to-main
    if: vars.GCP_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    concurrency:
      group: gcp-production
      cancel-in-progress: false
    env:
      # Images are built HERE and pulled by the host. Building on the
      # production box (2 cores, 1GB, also running the bot) drove load
      # above 12, starved the trading loop to 5-7 minute cycles, and
      # timed out two deploys mid-session on 2026-09-22.
      BOT_IMAGE_REPO: ghcr.io/${{ github.repository }}/trader
      DASHBOARD_IMAGE_REPO: ghcr.io/${{ github.repository }}/dashboard
      GCP_HOST: ${{ secrets.GCP_HOST }}
      GCP_USER: ${{ secrets.GCP_USER }}
      GCP_SSH_PORT: ${{ secrets.GCP_SSH_PORT || '22' }}
      GCP_SSH_PRIVATE_KEY: ${{ secrets.GCP_SSH_PRIVATE_KEY }}
      GCP_KNOWN_HOSTS: ${{ secrets.GCP_KNOWN_HOSTS }}
    steps:
      # Deliberately no `ref:` override - this checks out GITHUB_SHA, the
      # exact commit paper-sim-gate already validated. merge-to-main's
      # fast-forward-style merge (no conflicts are possible on this path)
      # makes main's tree byte-identical to it, so there's no need to
      # check out main itself here.
      - uses: actions/checkout@v4

      - name: Configure verified SSH access
        run: |
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$GCP_SSH_PRIVATE_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$GCP_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Log in to the image registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push the trader image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ env.BOT_IMAGE_REPO }}:${{ github.sha }}
          # Layer cache lives in Actions, so an unchanged base layer is
          # never rebuilt - this is also what keeps the build inside the
          # timeout the on-host build kept blowing.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push the dashboard image
        uses: docker/build-push-action@v5
        with:
          context: ./ui
          push: true
          tags: ${{ env.DASHBOARD_IMAGE_REPO }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Package release
        run: |
          tar \
            --exclude=.git \
            --exclude=.env \
            --exclude=.venv \
            --exclude=.webull-skill-venv \
            --exclude=conf \
            --exclude=logs \
            --exclude=__pycache__ \
            -czf "$RUNNER_TEMP/webull-bot-${GITHUB_SHA}.tar.gz" .

      - name: Upload release
        run: |
          scp \
            -P "$GCP_SSH_PORT" \
            "$RUNNER_TEMP/webull-bot-${GITHUB_SHA}.tar.gz" \
            "${GCP_USER}@${GCP_HOST}:/tmp/webull-bot-${GITHUB_SHA}.tar.gz"

      - name: Authorise the host to pull the release image
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Piped over stdin rather than passed as an argument, so the
          # token never appears in the host's process list. GITHUB_TOKEN
          # is scoped to this run and expires with it, so no long-lived
          # credential is stored on the box.
          printf '%s' "$REGISTRY_TOKEN" | ssh             -p "$GCP_SSH_PORT"             "${GCP_USER}@${GCP_HOST}"             "docker login ghcr.io -u '${GITHUB_ACTOR}' --password-stdin"

      - name: Deploy to the live host
        run: |
          ssh \
            -p "$GCP_SSH_PORT" \
            "${GCP_USER}@${GCP_HOST}" \
            "BOT_IMAGE_REPO='${BOT_IMAGE_REPO}' DASHBOARD_IMAGE_REPO='${DASHBOARD_IMAGE_REPO}' /opt/webull-bot/bin/deploy '/tmp/webull-bot-${GITHUB_SHA}.tar.gz' '${GITHUB_SHA}'"
